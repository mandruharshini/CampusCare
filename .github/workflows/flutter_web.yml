name: Flutter Web Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter platform files
        run: flutter create . --platforms=web
      - name: Install dependencies
        run: flutter pub get
      - name: Verify web build
        run: flutter build web --release
